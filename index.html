<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohan AI Assistant | Powered by Gemini 3.8 Flash</title>
<meta name="pushsdk" content="baa8f6e33ff0f18be4bb50acab5fe5b5">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* Ad Banner Container Sidebar */
        .sidebar-ad-container {
            margin-top: auto;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 25px;
            background: #1e293b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        /* Input Box */
        .input-area {
            padding: 20px;
            background: #1e293b;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button.send-btn {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">🤖 Rohan AI Engine</div>
        <div class="status-badge">🟢 Gemini 3.8 Flash Active</div>

        <!-- AdSense Sidebar Display Block -->
        <div class="sidebar-ad-container">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; height:100%"
                 data-ad-client="ca-pub-3896978698655641"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <div style="font-size: 0.8rem; color: #64748b;">
            Created by Rohan Rana (Anna)
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <span>⚡ Live Interactive AI Powered by Google Gemini 3.8 Flash</span>
        </div>

        <div class="messages" id="chatBox">
            <div class="message ai-message">
                Namaste Anna! Main Rohan Rana ka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte hain!
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Yahan apna sawal poochen..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Bhejen</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6KzYOjtI6VSovk3M8KN-rmBsxOW-vyv85RtDQ0IkPjXNA";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = 'Soch raha hoon...';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiDiv.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiDiv.textContent = 'API Error: ' + data.error.message;
                } else {
                    aiDiv.textContent = 'Kshama karen, uttar praapt karne mein koi dikkat hui.';
                }
            } catch (err) {
                aiDiv.textContent = 'Network ya API error. Kripya dobara prayas karen.';
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
