<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohan AI Assistant | Powered by Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .api-btn:hover {
            background: rgba(56, 189, 248, 0.3);
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 25px;
            background: #1e293b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            color: #94a3b8;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        /* Input Box */
        .input-area {
            padding: 20px;
            background: #1e293b;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button.send-btn {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">🤖 Rohan AI Engine</div>
        <button class="api-btn" onclick="setApiKey()">🔑 Gemini API Key दर्ज करें</button>
        <div style="font-size: 0.8rem; color: #64748b; margin-top: auto;">
            Created by Rohan Rana (Anna)
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            ⚡ Live Interactive AI Powered by Google Gemini
        </div>

        <div class="messages" id="chatBox">
            <div class="message ai-message">
                नमस्ते! मैं आपका एआई असिस्टेंट हूँ। आप मुझसे कुछ भी सवाल पूछ सकते हैं!
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="यहाँ अपना सवाल पूछें..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        function setApiKey() {
            const key = prompt('अपनी Google Gemini API Key यहाँ डालें:', apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
                alert('API Key सफलतापूर्वक सेव हो गई है!');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Show User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (!apiKey) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-message';
                errorDiv.textContent = 'कृपया पहले बाईं तरफ बने "Gemini API Key दर्ज करें" बटन पर क्लिक करके अपनी API Key डालें। (API Key आप Google AI Studio से मुफ्त में ले सकते हैं)';
                chatBox.appendChild(errorDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return;
            }

            // Show AI Loading Message
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = 'सोच रहा हूँ...';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiDiv.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    aiDiv.textContent = 'क्षमा करें, उत्तर प्राप्त करने में कोई त्रुटि हुई। कृपया अपनी API Key की जाँच करें।';
                }
            } catch (err) {
                aiDiv.textContent = 'नेटवर्क या API एरर। कृपया दोबारा प्रयास करें।';
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
