    <script>
        const adNetworkUrl = "https://afders.org/1/673f83c2f8b777bfed9d8707e0d9bfac";

        let currentBalance = parseInt(localStorage.getItem('rohan_game_wallet')) || 100;
        let puzzleState = [1, 2, 3, 4, 5, 6, 7, 8, ''];
        let moveCount = 0;

        function updateWalletDisplay() {
            document.getElementById('userBalance').innerText = `₹${currentBalance}`;
            localStorage.setItem('rohan_game_wallet', currentBalance);
        }

        function triggerAd() {
            window.open(adNetworkUrl, '_self');
        }

        function renderPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';

            puzzleState.forEach((val, idx) => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (val === '' ? ' empty' : '');
                tile.innerText = val;
                tile.onclick = () => moveTile(idx);
                grid.appendChild(tile);
            });
        }

        function getValidNeighbors(emptyIdx) {
            const neighbors = [];
            const row = Math.floor(emptyIdx / 3);
            const col = emptyIdx % 3;

            if (row > 0) neighbors.push(emptyIdx - 3); // Up
            if (row < 2) neighbors.push(emptyIdx + 3); // Down
            if (col > 0) neighbors.push(emptyIdx - 1); // Left
            if (col < 2) neighbors.push(emptyIdx + 1); // Right

            return neighbors;
        }

        function moveTile(idx) {
            const emptyIdx = puzzleState.indexOf('');
            const validMoves = getValidNeighbors(emptyIdx);

            if (validMoves.includes(idx)) {
                puzzleState[emptyIdx] = puzzleState[idx];
                puzzleState[idx] = '';
                moveCount++;

                renderPuzzle();

                if (moveCount % 5 === 0) {
                    triggerAd();
                }

                checkPuzzleWin();
            }
        }

        function checkPuzzleWin() {
            const winningState = [1, 2, 3, 4, 5, 6, 7, 8, ''];
            const isWin = puzzleState.every((val, idx) => val === winningState[idx]);

            if (isWin && moveCount > 0) {
                currentBalance += 100;
                updateWalletDisplay();
                document.getElementById('gameMsg').innerText = "🎉 Badhai Ho! Hard Puzzle Solved! ₹100 Added!";
                triggerAd();
            }
        }

        // Guaranteed Solvable Shuffle Logic
        function shufflePuzzle() {
            moveCount = 0;
            puzzleState = [1, 2, 3, 4, 5, 6, 7, 8, ''];

            for (let i = 0; i < 100; i++) {
                const emptyIdx = puzzleState.indexOf('');
                const neighbors = getValidNeighbors(emptyIdx);
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                
                puzzleState[emptyIdx] = puzzleState[randomNeighbor];
                puzzleState[randomNeighbor] = '';
            }

            renderPuzzle();
            document.getElementById('gameMsg').innerText = "Numbers ko 1 se 8 tak line me lagayein!";
            triggerAd();
        }

        function openWithdrawModal() {
            document.getElementById('withdrawNotice').innerHTML = `Aapka current balance <b>₹${currentBalance}</b> hai.<br><br>Account me abhi paryaapt paise nahi hain. Minimum withdrawal limit <b>₹1,000</b> hai!`;
            document.getElementById('withdrawModal').style.display = 'flex';
            triggerAd();
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        // Initialize Game
        shufflePuzzle();
        updateWalletDisplay();
    </script>
