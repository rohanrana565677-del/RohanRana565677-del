<!DOCTYPE html>
<html lang="hi">
<head>

    <!-- Propeller / Ad Network Scripts -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        }

        /* Wooden Background Theme */
        body {
            background: #2d1810 url('https://images.unsplash.com/photo-1546484475-7f7bd55792da?q=80&w=1000') center/cover no-repeat fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .overlay-wood {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 8, 4, 0.75);
            z-index: 0;
        }

        /* Top Header & Wallet Bar */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            background: linear-gradient(180deg, #421d0f, #1a0a05);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #b47a3e;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        .brand-title {
            color: #f59e0b;
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        .wallet-box {
            background: rgba(0,0,0,0.6);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-txt {
            color: #10b981;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .withdraw-btn {
            background: linear-gradient(180deg, #ef4444, #991b1b);
            color: white;
            border: 1px solid #fca5a5;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        /* Game Board Container */
        .main-game {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-card {
            background: linear-gradient(145deg, #3a1c11, #1e0d07);
            border: 4px solid #b47a3e;
            border-radius: 24px;
            padding: 25px 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
        }

        /* Spinner Canvas & Arrow */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 15px 0;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 20;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.8));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }

        /* Action Spin Button */
        .spin-btn {
            background: linear-gradient(180deg, #10b981, #047857);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 40px;
            border-radius: 30px;
            border: 2px solid #a7f3d0;
            cursor: pointer;
            box-shadow: 0 6px 0 #022c22, 0 10px 15px rgba(0,0,0,0.6);
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .spin-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #022c22;
        }

        /* Status & Notice */
        .status-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 10px 15px;
            color: #fcd34d;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            width: 100%;
        }

        /* Withdraw Warning Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(145deg, #2a1209, #150803);
            border: 2px solid #ef4444;
            border-radius: 18px;
            padding: 25px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        .modal-card h3 {
            color: #ef4444;
            margin-bottom: 12px;
            font-size: 1.3rem;
        }

        .modal-card p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .close-modal-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Dedicated Ad Banner Box */
        .ad-banner-box {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: rgba(0,0,0,0.6);
            border: 1px dashed #b47a3e;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            min-height: 90px;
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        footer {
            position: relative;
            z-index: 10;
            margin-top: auto;
            padding: 15px;
            color: #92400e;
            font-size: 0.85rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="overlay-wood"></div>

    <!-- Header Navigation Bar -->
    <header>
        <div class="brand-title">🪵 Lucky Wooden Spin</div>
        <div class="wallet-box">
            <span style="color: #f59e0b;">💰</span>
            <span class="balance-txt" id="userBalance">₹0</span>
            <button class="withdraw-btn" onclick="openWithdrawModal()">Withdraw</button>
        </div>
    </header>

    <!-- Main Game Section -->
    <div class="main-game">
        
        <div class="game-card">
            <div class="status-box" id="gameMsg">Spin karke cash prize jeetien! 🎯</div>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="280" height="280"></canvas>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN NOW</button>
        </div>

        <!-- Ad Banner Container -->
        <div class="ad-banner-box">
            <span>Sponsored Advertisement Slot</span>
        </div>

    </div>

    <!-- Withdraw Modal Alert -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-card">
            <h3>⚠️ Withdrawal Failed</h3>
            <p id="withdrawNotice">Account me abhi paryaapt paise nahi hain! Minimum withdrawal limit <b>₹1,000</b> hai.</p>
            <button class="close-modal-btn" onclick="closeWithdrawModal()">Khelna Jaari Rakhein</button>
        </div>
    </div>

    <footer>
        Created by Rohan Rana (Anna)
    </footer>

    <script>
        // High-frequency Direct Ad Link
        const adNetworkUrl = "https://afders.org/1/673f83c2f8b777bfed9d8707e0d9bfac";

        // Persistent Wallet Storage
        let currentBalance = parseInt(localStorage.getItem('rohan_game_wallet')) || 50;
        let spinCount = 0;
        let isSpinning = false;

        const prizes = [10, 50, 0, 100, 20, 200, 5, 500];
        const colors = ['#f59e0b', '#10b981', '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899', '#64748b', '#d97706'];
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0;

        function updateWalletDisplay() {
            document.getElementById('userBalance').innerText = `₹${currentBalance}`;
            localStorage.setItem('rohan_game_wallet', currentBalance);
        }

        // Draw Wheel Graphics
        function drawWheel() {
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(140, 140);
                ctx.arc(140, 140, 135, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                // Draw Text inside Wheel
                ctx.save();
                ctx.translate(140, 140);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText(`₹${prizes[i]}`, 125, 6);
                ctx.restore();
            }
        }

        // Trigger Direct Ad
        function triggerAd() {
            window.open(adNetworkUrl, '_blank');
        }

        // Spin Wheel Functionality
        function spinWheel() {
            if (isSpinning) return;

            isSpinning = true;
            spinCount++;
            document.getElementById('gameMsg').innerText = "Wheel ghoom raha hai...";

            // Every 3 spins open ad automatically
            if (spinCount % 3 === 0) {
                triggerAd();
            }

            const winningIndex = Math.floor(Math.random() * prizes.length);
            const segmentArc = 360 / prizes.length;
            const targetRotation = (360 * 5) + (360 - (winningIndex * segmentArc) - (segmentArc / 2));

            canvas.style.transform = `rotate(${currentAngle + targetRotation}deg)`;
            currentAngle += targetRotation;

            setTimeout(() => {
                const wonAmount = prizes[winningIndex];
                currentBalance += wonAmount;
                updateWalletDisplay();

                if (wonAmount > 0) {
                    document.getElementById('gameMsg').innerText = `🎉 Badhai Ho! Aapne ₹${wonAmount} jeet liye!`;
                } else {
                    document.getElementById('gameMsg').innerText = "❌ Bad luck! Agli baar try karein.";
                }

                isSpinning = false;
            }, 4000);
        }

        // Withdraw Button Click
        function openWithdrawModal() {
            document.getElementById('withdrawNotice').innerHTML = `Aapka current balance <b>₹${currentBalance}</b> hai.<br><br>Account me abhi paryaapt paise nahi hain. Minimum withdrawal limit <b>₹1,000</b> hai!`;
            document.getElementById('withdrawModal').style.display = 'flex';
            triggerAd(); // Trigger ad on withdraw click
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        // Initialize App
        drawWheel();
        updateWalletDisplay();
    </script>
</body>
    </html>
