        <!-- Top Ad Slot with Bicea script integration & Banner -->

    <script>
        const adNetworkUrl = "https://afders.org/1/673f83c2f8b777bfed9d8707e0d9bfac";

        let currentBalance = parseInt(localStorage.getItem('rohan_game_wallet')) || 150;
        let spinCount = 0;
        let isSpinning = false;

        const prizes = [10, 50, 0, 100, 20, 200, 5, 500];
        const colors = ['#f59e0b', '#10b981', '#ef4444', '#3b82f6', '#8b5cf6', '#ec4899', '#64748b', '#d97706'];
        
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentAngle = 0;

        function updateWalletDisplay() {
            document.getElementById('userBalance').innerText = `₹${currentBalance}`;
            localStorage.setItem('rohan_game_wallet', currentBalance);
        }

        function drawWheel() {
            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(125, 125);
                ctx.arc(125, 125, 120, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(125, 125);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(`₹${prizes[i]}`, 110, 5);
                ctx.restore();
            }
        }

        function triggerAd() {
            window.open(adNetworkUrl, '_blank');
        }

        function spinWheel() {
            if (isSpinning) return;

            isSpinning = true;
            spinCount++;
            document.getElementById('gameMsg').innerText = "Wheel ghoom raha hai...";

            if (spinCount % 2 === 0) {
                triggerAd();
            }

            const winningIndex = Math.floor(Math.random() * prizes.length);
            const segmentArc = 360 / prizes.length;
            const targetRotation = (360 * 5) + (360 - (winningIndex * segmentArc) - (segmentArc / 2));

            canvas.style.transform = `rotate(${currentAngle + targetRotation}deg)`;
            currentAngle += targetRotation;

            setTimeout(() => {
                const wonAmount = prizes[winningIndex];
                currentBalance += wonAmount;
                updateWalletDisplay();

                if (wonAmount > 0) {
                    document.getElementById('gameMsg').innerText = `🎉 Badhai Ho! Aapne ₹${wonAmount} jeet liye!`;
                } else {
                    document.getElementById('gameMsg').innerText = "❌ Better luck next time!";
                }

                isSpinning = false;
            }, 4000);
        }

        function openWithdrawModal() {
            document.getElementById('withdrawNotice').innerHTML = `Aapka current balance <b>₹${currentBalance}</b> hai.<br><br>Account me abhi paryaapt paise nahi hain. Minimum withdrawal limit <b>₹1,000</b> hai!`;
            document.getElementById('withdrawModal').style.display = 'flex';
            triggerAd();
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        drawWheel();
        updateWalletDisplay();
    </script>
