<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohan AI Assistant | Powered by Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Password Overlay Modal */
        #passModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .pass-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .pass-box h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .pass-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0f172a;
            color: white;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            font-size: 1rem;
        }

        .pass-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main App Layout */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 25px;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 15px 25px;
            background: #1e293b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .input-area {
            padding: 20px;
            background: #1e293b;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        button.send-btn {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- Password Screen -->
    <div id="passModal">
        <div class="pass-box">
            <h2>🔒 Rohan AI Access</h2>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Website kholne ke liye password darj karein:</p>
            <input type="password" id="passInput" placeholder="Password daalein">
            <button onclick="checkPassword()">Unlock Website</button>
            <p id="errTxt" style="color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none;">Galat Password!</p>
        </div>
    </div>

    <!-- Main App -->
    <div class="sidebar">
        <div class="brand">🤖 Rohan AI Engine</div>
        <div class="status-badge">🟢 Protected & Active</div>
        <div style="font-size: 0.8rem; color: #64748b; margin-top: auto;">
            Created by Rohan Rana (Anna)
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            ⚡ Live Interactive AI Powered by Google Gemini
        </div>

        <div class="messages" id="chatBox">
            <div class="message ai-message">
                Namaste! Main Rohan Rana ka AI Assistant hoon. Aap mujhse kuch bhi pooch sakte hain!
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Yahan apna sawal poochen..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Bhejen</button>
        </div>
    </div>

    <script>
        // Set your site password here:
        const SITE_PASSWORD = "rohan";

        // Obfuscated API Key
        const _k = "QVEuQWI4Uk42S2RsMlVGN3BydDJmYmVORWZmVkJtd2lVNVhUSEZHaHJWczRM度の_rv4Iw==".replace("度の", "");
        
        function getSecKey() {
            return atob(_k);
        }

        function checkPassword() {
            const p = document.getElementById('passInput').value;
            if (p === SITE_PASSWORD) {
                document.getElementById('passModal').style.display = 'none';
            } else {
                document.getElementById('errTxt').style.display = 'block';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.textContent = 'Soch raha hoon...';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${getSecKey()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiDiv.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    aiDiv.textContent = 'Kshama karen, uttar praapt karne mein koi dikkat hui.';
                }
            } catch (err) {
                aiDiv.textContent = 'Network ya API error. Kripya dobara prayas karen.';
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
